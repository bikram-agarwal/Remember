<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remember - Icon Catalog</title>
  <style>
    @font-face {
      font-family: 'Remember Symbols Rounded';
      src: url('../app/src/main/res/font/material_symbols_rounded.ttf') format('truetype');
      font-weight: 100 700;
      font-style: normal;
      font-display: block;
    }

    :root {
      color-scheme: light dark;
      --bg: #f8f7f1;
      --surface: #fffdf8;
      --surface-2: #eef4ef;
      --surface-3: #edf1f8;
      --text: #20241f;
      --muted: #616a61;
      --line: #d7ded3;
      --accent: #256f55;
      --accent-2: #315f8b;
      --warning: #9b5d16;
      --shadow: 0 1px 2px rgba(31, 37, 30, .08), 0 14px 34px rgba(31, 37, 30, .09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121511;
        --surface: #1b201b;
        --surface-2: #222b23;
        --surface-3: #1f2936;
        --text: #eef2ec;
        --muted: #bbc6b8;
        --line: #354034;
        --accent: #8ed2a7;
        --accent-2: #9abce2;
        --warning: #f0c070;
        --shadow: none;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-weight: 750;
      cursor: pointer;
      padding: 8px 12px;
    }

    button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .page {
      width: min(1500px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .hero {
      display: grid;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1;
      letter-spacing: 0;
    }

    .lede {
      margin: 0;
      max-width: 980px;
      color: var(--muted);
      font-weight: 650;
    }

    .source {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      white-space: pre-wrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .stat strong {
      display: block;
      font-size: 26px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      gap: 10px;
      margin: 0 0 24px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search {
      flex: 1 1 280px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 0 12px;
    }

    .status {
      color: var(--muted);
      font-weight: 750;
    }

    .section-index {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding-bottom: 2px;
    }

    .section-link {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 750;
    }

    .section-link span:last-child {
      color: var(--muted);
    }

    .brand-divider {
      margin: 48px 0 20px;
      padding-top: 24px;
      border-top: 2px solid var(--line);
    }

    .brand-divider h2 {
      margin: 0 0 6px;
      font-size: 32px;
      letter-spacing: 0;
    }

    .brand-divider p {
      margin: 0;
      color: var(--muted);
      font-weight: 650;
    }

    section {
      margin: 0 0 38px;
      scroll-margin-top: 110px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 12px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .section-header span {
      color: var(--muted);
      font-weight: 750;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .tile {
      min-width: 0;
      display: grid;
      grid-template-rows: 58px auto auto;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 12px;
    }

    .preview {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      justify-self: center;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--accent);
      overflow: hidden;
    }

    .tile.brand .preview {
      background: var(--surface-3);
      color: var(--accent-2);
    }

    .material-symbol {
      font-family: 'Remember Symbols Rounded';
      font-weight: 500;
      font-style: normal;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      font-feature-settings: 'liga';
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }

    .preview svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    .preview img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
    }

    .label {
      min-width: 0;
      text-align: center;
      font-size: 13px;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .key {
      min-width: 0;
      text-align: center;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      overflow-wrap: anywhere;
    }


    .hidden {
      display: none !important;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      font-weight: 750;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100vw - 20px, 1500px);
        padding-top: 20px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      }
    }
  </style>
</head>

  <script>
    const catalogPayload = JSON.parse(document.getElementById('catalog-data').textContent);
    const { stats, categories } = catalogPayload;
    const statsNode = document.getElementById('stats');
    const indexNode = document.getElementById('section-index');
    const catalogNode = document.getElementById('catalog');
    const searchNode = document.getElementById('search');
    const statusNode = document.getElementById('visible-status');
    let activeKind = 'all';

    const statCards = [
      [stats.total, 'total catalog entries'],
      [stats.symbols, `${stats.symbolSections} Material Symbol sections`],
      [stats.brands, `${stats.brandSections} brand sections`],
      [stats.vectorBrands, 'brand vector drawables'],
      [stats.pngBrands, 'legacy PNG brand drawables'],
    ];
    statsNode.innerHTML = statCards.map(([value, label]) => `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`).join('');


    indexNode.innerHTML = categories.map(section => `<a class="section-link" href="#${section.key}"><span>${escapeHtml(section.label)}</span><span>${section.items.length}</span></a>`).join('');

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function iconPreview(item) {
      if (item.kind === 'symbol') {
        return `<span class="material-symbol" aria-hidden="true">${escapeHtml(item.symbol)}</span>`;
      }
      if (item.svg) return item.svg;
      if (item.assetPath) return `<img src="${escapeHtml(item.assetPath)}" alt="">`;
      return `<span class="material-symbol" aria-hidden="true">hide_image</span>`;
    }

    function tile(item, section) {
      const searchable = [item.key, item.slug, item.label, item.symbol, item.drawable, item.assetPath, section.label].filter(Boolean).join(' ').toLowerCase();
      return `<article class="tile ${item.kind}" data-key="${escapeHtml(item.key)}" data-kind="${item.kind}" data-search="${escapeHtml(searchable)}">
        <div class="preview">${iconPreview(item)}</div>
        <div class="label" title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</div>
        <div class="key">${escapeHtml(item.key)}</div>
      </article>`;
    }

    function render() {
      let html = '';
      categories.forEach((section, index) => {
        if (section.kind === 'brand' && categories[index - 1]?.kind !== 'brand') {
          html += '<div class="brand-divider"><h2>Brands</h2><p>Bundled drawable entries grouped the same way the app picker presents them.</p></div>';
        }
        html += `<section id="${section.key}" data-kind="${section.kind}"><div class="section-header"><h2>${escapeHtml(section.label)}</h2><span>${section.items.length} entries</span></div><div class="grid">${section.items.map(item => tile(item, section)).join('')}</div></section>`;
      });
      catalogNode.innerHTML = html;
      filterCatalog();
    }

    function filterCatalog() {
      const query = searchNode.value.trim().toLowerCase();
      let visible = 0;
      document.querySelectorAll('.tile').forEach(node => {
        const kindMatch = activeKind === 'all' || node.dataset.kind === activeKind;
        const searchMatch = !query || node.dataset.search.includes(query);
        const show = kindMatch && searchMatch;
        node.classList.toggle('hidden', !show);
        if (show) visible += 1;
      });
      document.querySelectorAll('section').forEach(section => {
        const hasVisible = Array.from(section.querySelectorAll('.tile')).some(tile => !tile.classList.contains('hidden'));
        const kindMatch = activeKind === 'all' || section.dataset.kind === activeKind;
        section.classList.toggle('hidden', !hasVisible || !kindMatch);
      });
      statusNode.textContent = `${visible} of ${stats.total} visible`;
      const hasAny = visible > 0;
      document.querySelector('.empty')?.remove();
      if (!hasAny) {
        catalogNode.insertAdjacentHTML('beforeend', '<div class="empty">No icons match the current filter.</div>');
      }
    }

    document.querySelectorAll('[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        activeKind = button.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
        filterCatalog();
      });
    });
    searchNode.addEventListener('input', filterCatalog);
    document.getElementById('copy-visible').addEventListener('click', async () => {
      const keys = Array.from(document.querySelectorAll('.tile:not(.hidden)')).map(node => node.dataset.key).join('\n');
      try {
        await navigator.clipboard.writeText(keys);
        statusNode.textContent = `Copied ${keys ? keys.split('\n').length : 0} visible keys`;
      } catch (error) {
        statusNode.textContent = 'Clipboard unavailable in this browser';
      }
    });

    render();
  </script>
