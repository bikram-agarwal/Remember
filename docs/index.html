<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remember</title>
  <meta name="description" content="Remember - notes, lists, and reminders for Android.">
  <style>
    :root {
      color-scheme: light dark;
      --text: #1a1a1a;
      --muted: #555;
      --bg: #fafafa;
      --link: #0b57d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e8e8e8;
        --muted: #a8a8a8;
        --bg: #121212;
        --link: #7ab4ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      color: var(--text);
      background: var(--bg);
    }
    h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.5rem; }
    .tagline { color: var(--muted); font-size: 1.05rem; margin: 0 0 1.5rem; }
    p { margin: 0 0 1rem; }
    nav { margin: 1.5rem 0; padding: 0; }
    nav a { color: var(--link); }
    .footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid #8884; font-size: 0.9rem; color: var(--muted); }
    .footer a { color: var(--link); }
  </style>
</head>
<body>
  <header>
    <h1>Remember</h1>
    <p class="tagline">Notes, lists, reminders - done right</p>
  </header>
  <main>
    <p>
      Remember is an Android app for tasks and notes, with reminders and a focus on a fast, local-first experience on your device.
    </p>
    <nav aria-label="Site">
      <a href="privacy.html">Privacy policy</a>
    </nav>
  </main>
  <footer class="footer">
    <a href="https://github.com/bikram-agarwal/Remember">Source on GitHub</a>
    <span aria-hidden="true"> · </span>
    <a href="https://play.google.com/store/apps/details?id=dev.bikram.remember">Google Play</a>
  </footer>
</body>
</html>
