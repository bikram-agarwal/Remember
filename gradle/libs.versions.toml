[versions]
java = "21"
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.8"
composeBom = "2026.05.01"
composeMaterial3Expressive = "1.5.0-alpha20"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
navigation = "2.9.8"
room = "2.8.4"
hilt = "2.59.2"
androidxHilt = "1.3.0"
coroutines = "1.11.0"
serialization = "1.11.0"
collectionsImmutable = "0.4.0"
biometric = "1.1.0"
datastore = "1.2.1"
glance = "1.3.0-alpha01"
graphicsShapes = "1.1.0"
